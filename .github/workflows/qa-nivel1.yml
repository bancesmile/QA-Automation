
name: QA - Nivel 1

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repositorio a evaluar (usuario/repositorio)"
        required: true
        type: string
      solution_path:
        description: "Ruta de la solucion .sln/.slnx (opcional)"
        required: false
        type: string
      project_path:
        description: "Ruta del proyecto principal .csproj (opcional)"
        required: false
        type: string
      tests_path:
        description: "Ruta del proyecto de pruebas .csproj (opcional)"
        required: false
        type: string

  workflow_call:
    inputs:
      repository:
        description: "Repositorio objetivo"
        required: false
        type: string
        default: ""
      solution_path:
        required: false
        type: string
        default: ""
      project_path:
        required: false
        type: string
        default: ""
      tests_path:
        required: false
        type: string
        default: ""
    secrets:
      QA_REPO_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  qa-nivel1:
    name: QA Nivel 1 - Estructura
    runs-on: ubuntu-24.04

    steps:
      - name: Validar repositorio objetivo
        shell: bash
        env:
          TARGET_REPO: ${{ inputs.repository || github.repository }}
        run: |
          if [[ ! "$TARGET_REPO" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Usa el formato usuario/repositorio"
            exit 1
          fi
          echo "Repositorio objetivo: $TARGET_REPO"

      - name: N1 - Obtener codigo del proyecto
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ github.event_name == 'workflow_call' && github.sha || '' }}
          token: ${{ secrets.QA_REPO_READ_TOKEN || github.token }}
          path: proyecto
          persist-credentials: false

      - name: N1-01 Validar estructura
        shell: bash
        working-directory: proyecto
        env:
          SOLUTION_PATH: ${{ inputs.solution_path }}
          PROJECT_PATH: ${{ inputs.project_path }}
          TESTS_PATH: ${{ inputs.tests_path }}
        run: |
          set -euo pipefail

          echo "Iniciando N1-01: Validacion de estructura"

          fail() {
            echo "::error::$1"
            echo "### N1-01 - FALLIDO" >> "$GITHUB_STEP_SUMMARY"
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # Buscar archivos de solucion
          mapfile -t solutions < <(
            find . -type f \( -name '*.sln' -o -name '*.slnx' \) \
              -not -path '*/obj/*' \
              -not -path '*/bin/*' | sort
          )

          # Buscar proyectos .NET
          mapfile -t projects < <(
            find . -type f -name '*.csproj' \
              -not -path '*/obj/*' \
              -not -path '*/bin/*' | sort
          )

          # Validar solucion
          if [[ -n "$SOLUTION_PATH" ]]; then
            [[ -f "$SOLUTION_PATH" ]] || fail "No existe la solucion indicada"
            solution="$SOLUTION_PATH"
          elif [[ ${#solutions[@]} -eq 1 ]]; then
            solution="${solutions[0]}"
          else
            fail "Se esperaba una solucion. Encontradas: ${#solutions[@]}. Especifica solution_path."
          fi

          # Identificar proyectos de pruebas
          test_candidates=()
          main_candidates=()

          for file in "${projects[@]}"; do
            filename="$(basename "$file")"

            if [[ "$filename" =~ [Tt]ests?\.csproj$ ]] || \
               grep -Eiq \
               'IsTestProject|Microsoft.NET.Test.Sdk|xunit|NUnit|MSTest' \
               "$file"; then
              test_candidates+=("$file")
            else
              main_candidates+=("$file")
            fi
          done

          # Validar proyecto principal
          if [[ -n "$PROJECT_PATH" ]]; then
            [[ -f "$PROJECT_PATH" ]] || fail "No existe el proyecto principal"
            main_project="$PROJECT_PATH"
          elif [[ ${#main_candidates[@]} -eq 1 ]]; then
            main_project="${main_candidates[0]}"
          else
            fail "No se pudo identificar un proyecto principal unico. Especifica project_path."
          fi

          # Validar proyecto de pruebas
          if [[ -n "$TESTS_PATH" ]]; then
            [[ -f "$TESTS_PATH" ]] || fail "No existe el proyecto de pruebas"
            test_project="$TESTS_PATH"
          elif [[ ${#test_candidates[@]} -eq 1 ]]; then
            test_project="${test_candidates[0]}"
          else
            fail "No se pudo identificar un proyecto de pruebas unico. Especifica tests_path."
          fi

          # Verificar extensiones y archivos distintos
          [[ "$solution" == *.sln || "$solution" == *.slnx ]] || fail "Extension de solucion invalida"
          [[ "$main_project" == *.csproj ]] || fail "Proyecto principal invalido"
          [[ "$test_project" == *.csproj ]] || fail "Proyecto de pruebas invalido"

          main_real="$(realpath "$main_project")"
          test_real="$(realpath "$test_project")"

          [[ "$main_real" != "$test_real" ]] || fail "El proyecto principal y el de pruebas deben ser distintos"

          echo "Solucion: $solution"
          echo "Proyecto principal: $main_project"
          echo "Proyecto de pruebas: $test_project"

          {
            echo "## QA Nivel 1 - Resultados"
            echo ""
            echo "| ID | Prueba | Estado |"
            echo "|---|---|---|"
            echo "| N1-01 | Estructura | APROBADO |"
            echo "| N1-02 a N1-11 | Controles adicionales | PENDIENTES |"
            echo "| N1-12 | Resultado global | NO EVALUADO |"
            echo ""
            echo "### Archivos detectados"
            echo "- Solucion: \`$solution\`"
            echo "- Proyecto principal: \`$main_project\`"
            echo "- Proyecto de pruebas: \`$test_project\`"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "N1-01: APROBADO"
