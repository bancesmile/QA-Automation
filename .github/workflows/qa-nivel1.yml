
name: QA - Nivel 1

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repositorio usuario/repositorio"
        required: true
        type: string
      solution_path:
        description: "Solucion opcional"
        required: false
        type: string
      project_path:
        description: "Proyecto principal opcional"
        required: false
        type: string
      tests_path:
        description: "Proyecto de pruebas opcional"
        required: false
        type: string
      qa_mode:
        description: "Politica QA"
        type: choice
        default: baseline
        options:
          - baseline
          - strict
      execution_mode:
        description: "Tipo de ejecucion"
        type: choice
        default: inspection
        options:
          - inspection
          - build_test
      functional_tests:
        description: "Ejecutar tests funcionales categorizados"
        type: boolean
        default: false

  workflow_call:
    inputs:
      repository:
        type: string
        required: false
        default: ""
      solution_path:
        type: string
        required: false
        default: ""
      project_path:
        type: string
        required: false
        default: ""
      tests_path:
        type: string
        required: false
        default: ""
      qa_mode:
        type: string
        required: false
        default: baseline
      execution_mode:
        type: string
        required: false
        default: inspection
      functional_tests:
        type: boolean
        required: false
        default: false
    secrets:
      QA_REPO_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  qa-nivel1:
    name: QA Nivel 1 - Analisis General
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      DOTNET_ENVIRONMENT: Testing
      ASPNETCORE_ENVIRONMENT: Testing
      CI: "true"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Validar parametros
        shell: bash
        env:
          TARGET: ${{ inputs.repository || github.repository }}
          QA_MODE: ${{ inputs.qa_mode || 'baseline' }}
          EXEC_MODE: ${{ inputs.execution_mode || 'inspection' }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]; then
            echo "::error::Usa usuario/repositorio"
            exit 1
          fi

          if [[ "$QA_MODE" != baseline && "$QA_MODE" != strict ]]; then
            echo "::error::Politica QA invalida"
            exit 1
          fi

          if [[ "$EXEC_MODE" != inspection && "$EXEC_MODE" != build_test ]]; then
            echo "::error::Modo de ejecucion invalido"
            exit 1
          fi

      - name: Descargar repositorio
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ github.event_name == 'workflow_call' && github.sha || '' }}
          token: ${{ secrets.QA_REPO_READ_TOKEN || github.token }}
          path: proyecto
          persist-credentials: false

      - name: N1-01 Detectar estructura
        id: structure
        if: steps.checkout.outcome == 'success'
        working-directory: proyecto
        shell: bash
        env:
          SOLUTION: ${{ inputs.solution_path }}
          PROJECT: ${{ inputs.project_path }}
          TESTS: ${{ inputs.tests_path }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import json
          import sys
          from pathlib import Path

          ignored = {
              ".git", "bin", "obj", "node_modules",
              ".vs", ".idea", "packages"
          }

          def find(ext):
              return sorted(
                  str(p) for p in Path(".").rglob("*")
                  if p.is_file()
                  and p.suffix.lower() in ext
                  and not any(x in ignored for x in p.parts)
              )

          def validate(value, extensions):
              p = Path(value)
              if not p.is_file() or p.suffix.lower() not in extensions:
                  raise ValueError(f"Ruta invalida: {value}")
              return str(p)

          try:
              solutions = find({".sln", ".slnx"})
              projects = find({".csproj"})
              sources = find({".cs"})

              solution = os.getenv("SOLUTION", "").strip()
              project = os.getenv("PROJECT", "").strip()
              tests = os.getenv("TESTS", "").strip()

              if solution:
                  solution = validate(solution, {".sln", ".slnx"})
              elif len(solutions) == 1:
                  solution = solutions[0]
              elif len(solutions) > 1:
                  raise ValueError(
                      "Varias soluciones: indica solution_path"
                  )

              test_projects = []
              profiles = {}

              for path in projects:
                  data = Path(path).read_text(
                      encoding="utf-8", errors="replace"
                  )

                  is_test = bool(re.search(
                      r"(tests?|specs?)\.csproj$|"
                      r"<IsTestProject>\s*true\s*</IsTestProject>|"
                      r"Microsoft\.NET\.Test\.Sdk|"
                      r"xunit|NUnit|MSTest",
                      Path(path).name + "\n" + data,
                      re.IGNORECASE
                  ))

                  if is_test:
                      test_projects.append(path)
                      continue

                  lower = data.lower()
                  if "microsoft.net.sdk.web" in lower:
                      profile = "web"
                  elif "microsoft.net.sdk.worker" in lower:
                      profile = "worker"
                  elif re.search(
                      r"<OutputType>\s*(Exe|WinExe)\s*</OutputType>",
                      data, re.IGNORECASE
                  ):
                      profile = "console"
                  else:
                      profile = "library"

                  profiles[path] = profile

              if tests:
                  selected = validate(tests, {".csproj"})
                  test_projects.append(selected)

              test_projects = sorted(set(test_projects))
              main_projects = [
                  p for p in projects if p not in test_projects
              ]

              if project:
                  project = validate(project, {".csproj"})
                  if project in test_projects:
                      raise ValueError("Proyecto principal es de pruebas")
              elif len(main_projects) == 1:
                  project = main_projects[0]

              if projects:
                  mode = "dotnet"
                  target = solution or project
                  if not target:
                      raise ValueError(
                          "Varias soluciones/proyectos: especifica ruta"
                      )
              elif sources:
                  mode = "source"
                  target = ""
              else:
                  raise ValueError("No se encontro codigo C#")

              if mode == "source":
                  profile = "source"
              elif project:
                  profile = profiles.get(project, "multiple")
              elif len(set(profiles.values())) == 1:
                  profile = next(iter(profiles.values()))
              else:
                  profile = "multiple"

              config = {
                  "mode": mode,
                  "profile": profile,
                  "target": target,
                  "tests": test_projects,
                  "projects": projects,
                  "sources": len(sources)
              }

              Path(".qa-config.json").write_text(
                  json.dumps(config, indent=2),
                  encoding="utf-8"
              )

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"mode={mode}\n")
                  f.write(f"profile={profile}\n")
                  f.write(
                      f"has_tests={str(bool(test_projects)).lower()}\n"
                  )

              print("N1-01 APROBADO")
              print("Tipo:", mode)
              print("Perfil:", profile)
              print("Objetivo:", target or "Codigo C#")
              print("Proyectos:", len(projects))
              print("Tests:", len(test_projects))

          except Exception as ex:
              print(f"::error::{ex}")
              sys.exit(1)
          PY

      - name: N1-07 a N1-11 Inspeccion general
        id: generic
        if: steps.structure.outcome == 'success'
        working-directory: proyecto
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          config = json.loads(
              Path(".qa-config.json").read_text()
          )

          ignored = {
              ".git", "bin", "obj", "node_modules",
              ".vs", ".idea"
          }

          sources = []
          for p in Path(".").rglob("*.cs"):
              if not p.is_file():
                  continue
              if any(part in ignored for part in p.parts):
                  continue
              sources.append(p)

          patterns = {
              "N1-07": [
                  r"\bMapHealthChecks\s*\(",
                  r"\bUseHealthChecks\s*\(",
                  r'\bMapGet\s*\(\s*"/health[^"]*"'
              ],
              "N1-08": [
                  r"\bMap(Get|Post|Put|Delete|Patch)\s*\(",
                  r"\[Http(Get|Post|Put|Delete|Patch)",
                  r"\bIRequestHandler\s*<"
              ],
              "N1-09": [
                  r"\[Authorize\b",
                  r"\bRequireAuthorization\s*\(",
                  r"\bAddAuthentication\s*\(",
                  r"\bAddAuthorization\s*\("
              ],
              "N1-10": [
                  r"\bUseExceptionHandler\s*\(",
                  r"\bAddProblemDetails\s*\(",
                  r"\bIExceptionHandler\b",
                  r"\bcatch\s*\("
              ],
              "N1-11": [
                  r"\bMoq\b",
                  r"\bNSubstitute\b",
                  r"\bFakeItEasy\b",
                  r"\bWireMock\b",
                  r"\bTestcontainers\b",
                  r"\bUseInMemoryDatabase\s*\("
              ]
          }

          results = {}

          for control, expressions in patterns.items():
              evidence = []

              for file in sources:
                  text = file.read_text(
                      encoding="utf-8", errors="replace"
                  )

                  for expr in expressions:
                      if re.search(expr, text, re.IGNORECASE):
                          evidence.append(str(file))
                          break

              evidence = sorted(set(evidence))

              if (
                  control == "N1-07"
                  and config["profile"] in ("console", "library", "source")
              ):
                  status = "NO APLICA"
              elif evidence:
                  status = "EVIDENCIA ESTATICA"
              else:
                  status = "SIN EVIDENCIA"

              results[control] = {
                  "status": status,
                  "files": evidence[:25],
                  "count": len(evidence)
              }

              print(
                  control, status,
                  "Archivos:", len(evidence)
              )

          Path(".qa-generic.json").write_text(
              json.dumps(results, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Instalar .NET SDK
        if: >-
          inputs.execution_mode == 'build_test' &&
          steps.structure.outputs.mode == 'dotnet'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: N1-02 Restaurar dependencias
        id: restore
        if: >-
          inputs.execution_mode == 'build_test' &&
          steps.structure.outcome == 'success' &&
          steps.structure.outputs.mode == 'dotnet'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          set -euo pipefail
          target=$(python3 -c \
            'import json; print(json.load(open(".qa-config.json"))["target"])')
          dotnet restore "$target" --verbosity minimal

      - name: N1-03 Verificar formato
        id: format
        if: >-
          inputs.execution_mode == 'build_test' &&
          steps.restore.outcome == 'success'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          set -euo pipefail
          target=$(python3 -c \
            'import json; print(json.load(open(".qa-config.json"))["target"])')
          dotnet format "$target" \
            --verify-no-changes \
            --no-restore \
            --verbosity normal 2>&1 | tee format.log

      - name: N1-04 Compilar
        id: build
        if: >-
          inputs.execution_mode == 'build_test' &&
          steps.restore.outcome == 'success'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          set -euo pipefail
          target=$(python3 -c \
            'import json; print(json.load(open(".qa-config.json"))["target"])')
          dotnet build "$target" \
            --configuration Release \
            --no-restore \
            --verbosity normal 2>&1 | tee build.log

      - name: N1-05 Registrar advertencias
        id: warnings
        if: always() && steps.build.outcome == 'success'
        working-directory: proyecto
        shell: bash
        run: |
          count=$(grep -Eic \
            ':[[:space:]]warning[[:space:]]' \
            build.log || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Coincidencias de advertencias: $count"

      - name: N1-06 Pruebas automatizadas
        id: tests
        if: >-
          inputs.execution_mode == 'build_test' &&
          steps.build.outcome == 'success' &&
          steps.structure.outputs.has_tests == 'true'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          config = json.loads(
              Path(".qa-config.json").read_text()
          )

          total = 0
          failed = False
          rootdir = Path("TestResults/N1-06")

          for i, project in enumerate(config["tests"], 1):
              destination = rootdir / str(i)
              destination.mkdir(parents=True, exist_ok=True)

              cmd = [
                  "dotnet", "test", project,
                  "--configuration", "Release",
                  "--logger", "trx;LogFileName=result.trx",
                  "--results-directory", str(destination)
              ]

              run = subprocess.run(cmd, check=False)
              if run.returncode != 0:
                  failed = True

              files = list(destination.glob("*.trx"))
              if not files:
                  failed = True

              for trx in files:
                  try:
                      root = ET.parse(trx).getroot()
                      node = root.find(".//{*}Counters")
                      if node is None:
                          failed = True
                          continue
                      total += int(node.get("executed", "0"))
                      if int(node.get("failed", "0")) > 0:
                          failed = True
                  except Exception:
                      failed = True

          print("Pruebas ejecutadas:", total)
          if failed or total == 0:
              sys.exit(1)
          PY

      - name: N1-07 a N1-11 Tests funcionales opcionales
        id: functional
        if: >-
          inputs.execution_mode == 'build_test' &&
          inputs.functional_tests == true &&
          steps.tests.outcome == 'success'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          config = json.loads(
              Path(".qa-config.json").read_text()
          )

          categories = {
              "N1-07": "QA_Health",
              "N1-08": "QA_Positive",
              "N1-09": "QA_Access",
              "N1-10": "QA_Errors",
              "N1-11": "QA_Isolation"
          }

          results = {}
          base = Path("TestResults/Funcionales")

          for control, category in categories.items():
              executed = 0
              failures = 0
              errors = False

              for i, project in enumerate(config["tests"], 1):
                  folder = base / control / str(i)
                  folder.mkdir(parents=True, exist_ok=True)

                  cmd = [
                      "dotnet", "test", project,
                      "--configuration", "Release",
                      "--filter", f"Category={category}",
                      "--logger", "trx;LogFileName=result.trx",
                      "--results-directory", str(folder)
                  ]

                  run = subprocess.run(cmd, check=False)
                  trx_files = list(folder.glob("*.trx"))

                  for trx in trx_files:
                      try:
                          root = ET.parse(trx).getroot()
                          node = root.find(".//{*}Counters")
                          if node is None:
                              errors = True
                              continue
                          executed += int(node.get("executed", "0"))
                          failures += int(node.get("failed", "0"))
                      except Exception:
                          errors = True

                  if run.returncode != 0:
                      errors = True

              if failures or errors:
                  status = "FALLIDO"
              elif executed:
                  status = "APROBADO"
              else:
                  status = "NO CONFIGURADO"

              results[control] = {
                  "status": status,
                  "executed": executed,
                  "failed": failures
              }

              print(control, status, executed)

          Path(".qa-functional.json").write_text(
              json.dumps(results, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-qa-nivel1
          path: |
            proyecto/.qa-config.json
            proyecto/.qa-generic.json
            proyecto/.qa-functional.json
            proyecto/format.log
            proyecto/build.log
            proyecto/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: N1-12 Consolidar resultados
        if: always()
        shell: bash
        env:
          REPO: ${{ inputs.repository || github.repository }}
          EXEC_MODE: ${{ inputs.execution_mode || 'inspection' }}
          QA_MODE: ${{ inputs.qa_mode || 'baseline' }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          STRUCTURE: ${{ steps.structure.outcome }}
          RESTORE: ${{ steps.restore.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          BUILD: ${{ steps.build.outcome }}
          WARNINGS: ${{ steps.warnings.outputs.count }}
          TESTS: ${{ steps.tests.outcome }}
          HAS_TESTS: ${{ steps.structure.outputs.has_tests }}
          FUNCTIONAL: ${{ steps.functional.outcome }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import sys
          from pathlib import Path

          env = os.environ

          def read_json(name):
              path = Path("proyecto") / name
              if not path.exists():
                  return {}
              try:
                  return json.loads(path.read_text())
              except Exception:
                  return {}

          config = read_json(".qa-config.json")
          generic = read_json(".qa-generic.json")
          functional = read_json(".qa-functional.json")

          execution = env["EXEC_MODE"]
          qa_mode = env["QA_MODE"]
          mode = config.get("mode", "")
          profile = config.get("profile", "")

          def label(value):
              return {
                  "success": "APROBADO",
                  "failure": "FALLIDO",
                  "skipped": "NO EJECUTADO"
              }.get(value, "NO EVALUADO")

          failed = (
              env["CHECKOUT"] != "success"
              or env["STRUCTURE"] != "success"
          )

          rows = []
          rows.append(("N1-01", "Estructura", label(env["STRUCTURE"])))

          if execution == "build_test":
              for key in ["RESTORE", "FORMAT", "BUILD"]:
                  if env[key] != "success":
                      failed = True

              if env["HAS_TESTS"] == "true":
                  test_status = label(env["TESTS"])
                  if env["TESTS"] != "success":
                      failed = True
              else:
                  test_status = "SIN PRUEBAS"
                  if qa_mode == "strict":
                      failed = True

              rows += [
                  ("N1-02", "Dependencias", label(env["RESTORE"])),
                  ("N1-03", "Formato", label(env["FORMAT"])),
                  ("N1-04", "Compilacion", label(env["BUILD"])),
                  ("N1-05", "Advertencias",
                   env["WARNINGS"] or "NO EVALUADO"),
                  ("N1-06", "Pruebas automaticas", test_status)
              ]
          else:
              for code, name in [
                  ("N1-02", "Dependencias"),
                  ("N1-03", "Formato"),
                  ("N1-04", "Compilacion"),
                  ("N1-05", "Advertencias"),
                  ("N1-06", "Pruebas automaticas")
              ]:
                  rows.append((code, name, "NO EJECUTADO"))

          names = {
              "N1-07": "Health Check",
              "N1-08": "Flujo positivo",
              "N1-09": "Acceso",
              "N1-10": "Manejo de errores",
              "N1-11": "Aislamiento externo"
          }

          func_complete = True

          for code, name in names.items():
              static = generic.get(code, {})
              actual = functional.get(code, {})
              result = actual.get("status") or static.get(
                  "status", "NO EVALUADO"
              )

              if result == "FALLIDO":
                  failed = True
              if result not in ("APROBADO", "NO APLICA"):
                  func_complete = False

              rows.append((code, name, result))

          if failed:
              global_status = "FALLIDO"
          elif execution == "inspection":
              global_status = "INSPECCION COMPLETADA"
          else:
              global_status = "APROBADO TECNICO"

          if qa_mode == "strict" and not func_complete:
              failed = True
              global_status = "FALLIDO - COBERTURA INCOMPLETA"

          rows.append(("N1-12", "Resultado global", global_status))

          lines = [
              "## QA Nivel 1 - Reporte",
              "",
              f"**Repositorio:** {env['REPO']}",
              f"**Modo:** {qa_mode}",
              f"**Ejecucion:** {execution}",
              f"**Tipo:** {mode or 'NO IDENTIFICADO'}",
              f"**Perfil:** {profile or 'NO IDENTIFICADO'}",
              "",
              "| ID | Control | Resultado |",
              "|---|---|---|"
          ]

          for code, name, status in rows:
              lines.append(f"| {code} | {name} | {status} |")

          lines += [
              "",
              "### Interpretacion",
              "",
              "- EVIDENCIA ESTATICA: se encontro un patron "
              "relacionado, pero no se comprobo el comportamiento.",
              "- SIN EVIDENCIA: no se encontro un patron reconocido; "
              "no demuestra ausencia de la funcionalidad.",
              "- NO EJECUTADO: se omitio el control por la modalidad.",
              "- NO APLICA: el perfil no requiere ese control.",
              "",
              "**Certificacion funcional:** " +
              ("CONTROLES COMPROBADOS" if func_complete and not failed
               else "INCOMPLETA"),
              "",
              "El resultado tecnico no equivale a una "
              "certificacion funcional completa."
          ]

          if failed:
              lines.extend([
                  "",
                  "### Controles que requieren atencion",
                  ""
              ])
              for code, name, state in rows:
                  if "FALLIDO" in state:
                      lines.append(f"- {code}: {name} ({state})")

          with open(env["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("\n".join(lines) + "\n")

          print("Resultado global:", global_status)

          if failed:
              sys.exit(1)
          PY
