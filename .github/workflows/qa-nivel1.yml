name: QA - Nivel 1

on:
  workflow_dispatch:
    inputs:
      repository:
        description: "Repositorio (usuario/repositorio)"
        required: true
        type: string

  workflow_call:
    inputs:
      repository:
        required: false
        type: string
        default: ""
      execution_mode:
        required: false
        type: string
        default: inspection
      qa_mode:
        required: false
        type: string
        default: baseline
      solution_path:
        required: false
        type: string
        default: ""
    secrets:
      QA_REPO_READ_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  qa-nivel1:
    name: QA Nivel 1 - Analisis General
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      REPO_OBJETIVO: ${{ inputs.repository || github.repository }}
      MODO_EJECUCION: ${{ inputs.execution_mode || 'inspection' }}
      POLITICA_QA: ${{ inputs.qa_mode || 'baseline' }}
      SOLUTION_PATH: ${{ inputs.solution_path || '' }}
      DOTNET_NOLOGO: "true"
      DOTNET_ENVIRONMENT: Testing
      ASPNETCORE_ENVIRONMENT: Testing
      CI: "true"

    steps:
      - name: Validar parametros
        id: params
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REPO_OBJETIVO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Usa usuario/repositorio; no URL ni .git"
            exit 1
          fi
          if [[ "$MODO_EJECUCION" != "inspection" && "$MODO_EJECUCION" != "build_test" ]]; then
            echo "::error::execution_mode invalido"
            exit 1
          fi
          if [[ "$POLITICA_QA" != "baseline" && "$POLITICA_QA" != "strict" ]]; then
            echo "::error::qa_mode invalido"
            exit 1
          fi
          echo "Repositorio: $REPO_OBJETIVO"
          echo "Ejecucion: $MODO_EJECUCION"

      - name: Descargar repositorio
        id: checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository || github.repository }}
          token: ${{ secrets.QA_REPO_READ_TOKEN || github.token }}
          path: proyecto
          persist-credentials: false

      - name: N1-01 Detectar estructura y tecnologia
        id: structure
        if: steps.checkout.outcome == 'success'
        working-directory: proyecto
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          excluded = {'.git', 'bin', 'obj', 'node_modules', '.vs', '.idea', 'packages'}
          def files(extension):
              return sorted(str(p) for p in Path('.').rglob('*')
                            if p.is_file() and p.suffix.lower() in extension
                            and not excluded.intersection(p.parts))

          solutions = files({'.sln', '.slnx'})
          projects = files({'.csproj'})
          sources = files({'.cs'})
          test_projects = []
          profiles = {}
          for path in projects:
              xml = Path(path).read_text(encoding='utf-8', errors='replace')
              name = Path(path).stem
              is_test = (bool(re.search(r'(?i)(test|tests|spec|specs)$', name)) or
                         bool(re.search(r'(?i)<IsTestProject>\s*true\s*</IsTestProject>|Microsoft\.NET\.Test\.Sdk|<PackageReference\s+Include="(?:xunit|nunit|mstest)', xml)))
              if is_test:
                  test_projects.append(path)
                  continue
              if re.search(r'(?i)Microsoft\.NET\.Sdk\.Web', xml):
                  profiles[path] = 'web'
              elif re.search(r'(?i)Microsoft\.NET\.Sdk\.Worker', xml):
                  profiles[path] = 'worker'
              elif re.search(r'(?i)<OutputType>\s*(Exe|WinExe)\s*</OutputType>', xml):
                  profiles[path] = 'console'
              else:
                  profiles[path] = 'library'

          requested = os.environ.get('SOLUTION_PATH', '').strip()
          if requested and (not Path(requested).is_file() or Path(requested).suffix.lower() not in {'.sln', '.slnx'}):
              print('::error::solution_path no existe o no es .sln/.slnx')
              sys.exit(1)

          main = [p for p in projects if p not in test_projects]
          target = requested or (solutions[0] if len(solutions) == 1 else
                                 main[0] if len(solutions) == 0 and len(main) == 1 else '')
          if projects:
              kind = 'dotnet'
          elif sources:
              kind = 'source'
          else:
              kind = 'unsupported'

          profile = (next(iter(set(profiles.values()))) if len(set(profiles.values())) == 1
                     else 'multiple' if profiles else 'source' if sources else 'unknown')
          config = dict(kind=kind, profile=profile, target=target,
                        solutions=solutions, projects=projects,
                        test_projects=test_projects, source_count=len(sources))
          Path('.qa-config.json').write_text(json.dumps(config, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'kind={kind}\n')
              output.write(f'profile={profile}\n')
              output.write(f'has_tests={str(bool(test_projects)).lower()}\n')
              output.write(f'has_target={str(bool(target)).lower()}\n')
          print(json.dumps(config, indent=2))
          if kind == 'unsupported':
              print('::error::Repositorio sin codigo C# o proyecto .NET')
              sys.exit(1)
          PY

      - name: N1-07 a N1-11 Inspeccion estatica generica
        id: inspection
        if: steps.structure.outcome == 'success'
        working-directory: proyecto
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          config = json.loads(Path('.qa-config.json').read_text(encoding='utf-8'))
          excluded = {'.git', 'bin', 'obj', 'node_modules', '.vs', '.idea', 'packages'}
          patterns = {
              'N1-07': [r'\bMapHealthChecks\s*\(', r'\bUseHealthChecks\s*\(', r'\bIHealthCheck\b', r'\bAddHealthChecks\s*\('],
              'N1-08': [r'\bMap(?:Get|Post|Put|Delete|Patch)\s*\(', r'\[Http(?:Get|Post|Put|Delete|Patch)', r'\bIRequestHandler\b', r'\bControllerBase\b'],
              'N1-09': [r'\[Authorize\b', r'\bRequireAuthorization\s*\(', r'\bAddAuthentication\s*\(', r'\bAddAuthorization\s*\(', r'\bJwtBearerDefaults\b'],
              'N1-10': [r'\bUseExceptionHandler\s*\(', r'\bAddProblemDetails\s*\(', r'\bIExceptionHandler\b', r'\bcatch\s*\('],
              'N1-11': [r'\bMoq\b', r'\bNSubstitute\b', r'\bFakeItEasy\b', r'\bWireMock\b', r'\bTestcontainers\b', r'\bUseInMemoryDatabase\s*\(']
          }
          evidence = {key: [] for key in patterns}
          paths = sorted(p for p in Path('.').rglob('*.cs')
                         if p.is_file() and not excluded.intersection(p.parts))
          for path in paths:
              for number, line in enumerate(path.read_text(encoding='utf-8', errors='replace').splitlines(), 1):
                  for key, expressions in patterns.items():
                      if any(re.search(expr, line, re.IGNORECASE) for expr in expressions):
                          evidence[key].append({'archivo': str(path), 'linea': number})
          results = {}
          for key, matches in evidence.items():
              status = 'EVIDENCIA ESTATICA' if matches else 'SIN EVIDENCIA'
              results[key] = {'estado': status, 'coincidencias': len(matches), 'ubicaciones': matches[:30]}
              print(f'{key}: {status} ({len(matches)} coincidencias)')
          Path('.qa-inspection.json').write_text(json.dumps(results, indent=2), encoding='utf-8')
          PY

      - name: Instalar SDK .NET (solo build_test)
        if: >-
          env.MODO_EJECUCION == 'build_test' &&
          steps.structure.outputs.kind == 'dotnet' &&
          steps.structure.outputs.has_target == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: N1-02 Restaurar dependencias
        id: restore
        if: >-
          env.MODO_EJECUCION == 'build_test' &&
          steps.structure.outputs.kind == 'dotnet' &&
          steps.structure.outputs.has_target == 'true'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          set -euo pipefail
          target=$(python3 -c 'import json;print(json.load(open(".qa-config.json"))["target"])')
          dotnet restore "$target" --verbosity minimal

      - name: N1-03 Verificar formato
        id: format
        if: env.MODO_EJECUCION == 'build_test' && steps.restore.outcome == 'success'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          set -euo pipefail
          target=$(python3 -c 'import json;print(json.load(open(".qa-config.json"))["target"])')
          dotnet format "$target" --verify-no-changes --no-restore --verbosity normal 2>&1 | tee format.log

      - name: N1-04 Compilar
        id: build
        if: env.MODO_EJECUCION == 'build_test' && steps.restore.outcome == 'success'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          set -euo pipefail
          target=$(python3 -c 'import json;print(json.load(open(".qa-config.json"))["target"])')
          dotnet build "$target" --configuration Release --no-restore --verbosity normal 2>&1 | tee build.log

      - name: N1-05 Registrar advertencias
        id: warnings
        if: always() && steps.build.outcome == 'success'
        working-directory: proyecto
        shell: bash
        run: |
          count=$(grep -Eic ':[[:space:]]warning[[:space:]]' build.log || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Coincidencias de advertencias: $count"

      - name: N1-06 Ejecutar tests existentes
        id: tests
        if: >-
          env.MODO_EJECUCION == 'build_test' &&
          steps.build.outcome == 'success' &&
          steps.structure.outputs.has_tests == 'true'
        continue-on-error: true
        working-directory: proyecto
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          projects = json.loads(Path('.qa-config.json').read_text())['test_projects']
          executed = 0
          failed = False
          for number, project in enumerate(projects, 1):
              destination = Path('TestResults') / str(number)
              destination.mkdir(parents=True, exist_ok=True)
              result = subprocess.run(['dotnet', 'test', project, '--configuration', 'Release',
                                       '--logger', 'trx;LogFileName=result.trx',
                                       '--results-directory', str(destination)], check=False)
              if result.returncode != 0:
                  failed = True
              files = list(destination.glob('*.trx'))
              if not files:
                  failed = True
              for file in files:
                  try:
                      node = ET.parse(file).getroot().find('.//{*}Counters')
                      if node is None:
                          failed = True
                          continue
                      executed += int(node.get('executed', '0'))
                      if int(node.get('failed', '0')) > 0:
                          failed = True
                  except (ET.ParseError, ValueError):
                      failed = True
          print(f'Tests ejecutados: {executed}')
          if failed or executed == 0:
              sys.exit(1)
          PY

      - name: Guardar evidencias
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-qa-nivel1
          path: |
            proyecto/.qa-config.json
            proyecto/.qa-inspection.json
            proyecto/format.log
            proyecto/build.log
            proyecto/TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: N1-12 Consolidar resultados
        if: always()
        shell: bash
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          STRUCTURE: ${{ steps.structure.outcome }}
          INSPECTION: ${{ steps.inspection.outcome }}
          KIND: ${{ steps.structure.outputs.kind }}
          HAS_TARGET: ${{ steps.structure.outputs.has_target }}
          HAS_TESTS: ${{ steps.structure.outputs.has_tests }}
          RESTORE: ${{ steps.restore.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          BUILD: ${{ steps.build.outcome }}
          WARNINGS: ${{ steps.warnings.outputs.count }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          e = os.environ
          def status(key):
              return {'success': 'APROBADO', 'failure': 'FALLIDO', 'skipped': 'NO EJECUTADO'}.get(e.get(key), 'NO EVALUADO')
          def read(filename):
              path = Path('proyecto') / filename
              try:
                  return json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
              except (OSError, ValueError):
                  return {}

          config = read('.qa-config.json')
          evidence = read('.qa-inspection.json')
          failing = []
          if e.get('CHECKOUT') != 'success':
              failing.append('Descarga: acceso al repositorio o token incorrecto')
          if e.get('STRUCTURE') != 'success':
              failing.append('N1-01: estructura no validada')
          if e.get('INSPECTION') != 'success':
              failing.append('Inspeccion estatica no completada')

          rows = [('N1-01', 'Estructura', status('STRUCTURE'))]
          if e['MODO_EJECUCION'] == 'build_test':
              if e.get('KIND') != 'dotnet' or e.get('HAS_TARGET') != 'true':
                  failing.append('Sin solucion/proyecto unico para ejecutar build_test')
              for key, label in [('RESTORE', 'N1-02'), ('FORMAT', 'N1-03'), ('BUILD', 'N1-04')]:
                  if e.get(key) != 'success':
                      failing.append(f'{label}: {status(key)}')
              if e.get('HAS_TESTS') == 'true' and e.get('TESTS') != 'success':
                  failing.append(f'N1-06: {status("TESTS")}')
              if e['POLITICA_QA'] == 'strict' and e.get('HAS_TESTS') != 'true':
                  failing.append('N1-06: sin pruebas en modo strict')
              rows += [
                  ('N1-02', 'Dependencias', status('RESTORE')),
                  ('N1-03', 'Formato', status('FORMAT')),
                  ('N1-04', 'Compilacion', status('BUILD')),
                  ('N1-05', 'Advertencias', e.get('WARNINGS') or 'NO EVALUADO'),
                  ('N1-06', 'Tests existentes', status('TESTS') if e.get('HAS_TESTS') == 'true' else 'SIN PRUEBAS')
              ]
          else:
              rows += [(code, name, 'NO EJECUTADO') for code, name in [
                  ('N1-02', 'Dependencias'), ('N1-03', 'Formato'),
                  ('N1-04', 'Compilacion'), ('N1-05', 'Advertencias'),
                  ('N1-06', 'Tests existentes')]]

          for code, label in [('N1-07', 'Health Check'), ('N1-08', 'Flujo positivo'),
                              ('N1-09', 'Acceso'), ('N1-10', 'Manejo de errores'),
                              ('N1-11', 'Aislamiento externo')]:
              rows.append((code, label, evidence.get(code, {}).get('estado', 'NO EVALUADO')))

          if failing:
              overall = 'FALLIDO'
          elif e['MODO_EJECUCION'] == 'inspection':
              overall = 'INSPECCION COMPLETADA'
          else:
              overall = 'APROBADO TECNICO'
          rows.append(('N1-12', 'Resultado global', overall))
          lines = [
              '## QA Nivel 1 - Reporte', '',
              f'**Repositorio:** `{e["REPO_OBJETIVO"]}`',
              f'**Ejecucion:** {e["MODO_EJECUCION"]}',
              f'**Politica:** {e["POLITICA_QA"]}',
              f'**Tipo:** {config.get("kind", "NO IDENTIFICADO")}',
              f'**Perfil:** {config.get("profile", "NO IDENTIFICADO")}', '',
              '| ID | Control | Resultado |', '|---|---|---|'
          ]
          lines += [f'| {code} | {label} | {result} |' for code, label, result in rows]
          lines += ['', '**Certificacion funcional:** INCOMPLETA',
                    '', 'La evidencia estatica no certifica comportamiento funcional.',
                    'INSPECCION COMPLETADA no equivale a compilacion o pruebas aprobadas.']
          if failing:
              lines += ['', '### Motivos de fallo']
              lines += [f'- {item}' for item in failing]
          lines += ['', '### Evidencias detectadas (primeras ubicaciones)']
          for code, item in evidence.items():
              lines.append(f'**{code}:** {item.get("coincidencias", 0)} coincidencias')
              for match in item.get('ubicaciones', [])[:5]:
                  lines.append(f'- `{match["archivo"]}:{match["linea"]}`')
          with open(e['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('\n'.join(lines) + '\n')
          print('Resultado:', overall)
          if failing:
              sys.exit(1)
          PY
